<!doctype html>
<!-- v12: the sign-in page. Served without a session; everything else in the
     app redirects here until someone signs in. Self-contained (v12.css only,
     no Tabler, no webfont) so it renders even if the rest of the bundle is
     mid-upgrade. Light is the startup theme, as in index.html. -->
<html lang="vi" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WAHL Vietnam — Sign in</title>
  <link rel="stylesheet" href="./v12.css">
</head>

<body>
  <div id="root"></div>
  <script src="./v12-shared.js"></script>
  <script src="./login.js"></script>
</body>

</html>
