<!doctype html>
<!-- DEMO ONLY. A self-contained mock of the proposed login page, hashed
     passwords and personal vaults. It does not talk to launcher.ps1 and never
     touches the real tracking data or the real vault. State lives in this
     browser's localStorage and "Reset demo" wipes it. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login &amp; Vaults Demo</title>
<style>
:root{
  --bg:#eef2f7;--panel:#fff;--soft:#f5f8fb;--input:#fff;--grey2:#e6ecf3;
  --header-line:#1e3a52;
  --blue:#14589f;--blue-hover:#0f4884;--blue2:#e7f0fa;--steel:#46586b;
  --good:#16703c;--good2:#e5f3ea;--warn:#8a5800;--warn2:#fdf2df;--bad:#b02318;--bad2:#fdeceb;
  --teal:#0d7c6b;--teal2:#e6f7f5;--neutral:#62748a;--neutral2:#eef1f5;
  --ink:#14202c;--ink2:#42556a;--muted:#5d6e83;
  --line:#d7e0e9;--line-strong:#b6c4d3;--focus:#2b7fd4;--focus-ring:0 0 0 3px rgba(43,127,212,.35);
  --sh1:0 1px 2px rgba(16,34,51,.06);--sh2:0 2px 6px rgba(16,34,51,.08),0 1px 2px rgba(16,34,51,.06);--sh3:0 10px 30px rgba(16,34,51,.18);
  --r1:4px;--r2:6px;--r3:9px;--ctl-h:40px;--ctl-h-sm:32px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --row-hover:#f2f6fa;--sidebar-w:232px;--topbar-h:52px;
  --sidebar-bg:#0f2438;--sidebar-ink:#dce7f2;--sidebar-muted:#8ba1b8;--sidebar-active:#1d4e7f;
}
html[data-theme="dark"]{
  --bg:#0d151f;--panel:#16212d;--soft:#1d2937;--input:#1b2733;--grey2:#263443;
  --blue:#4c9de6;--blue-hover:#6bb2ee;--blue2:#14304c;--steel:#93a7bb;
  --good:#4fd188;--good2:#10331f;--warn:#e8b85f;--warn2:#382d19;--bad:#ff8a7e;--bad2:#3b1f1c;
  --teal:#4fd1c5;--teal2:#103331;--neutral:#90a2b6;--neutral2:#222f3d;
  --ink:#e6edf5;--ink2:#b5c4d3;--muted:#8b9db0;--line:#2a3a4b;--line-strong:#3b4f63;
  --focus:#5aa9ee;--focus-ring:0 0 0 3px rgba(90,169,238,.38);
  --sh1:0 1px 2px rgba(0,0,0,.4);--sh2:0 2px 8px rgba(0,0,0,.45);--sh3:0 12px 34px rgba(0,0,0,.6);
  --row-hover:#1d2b3a;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{color:var(--ink);font-weight:600;letter-spacing:-.01em;margin:0}
a{color:var(--blue)}
code{background:var(--grey2);color:var(--ink);padding:1px 5px;border-radius:var(--r1);font-size:11.5px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
pre{background:var(--soft);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3);font:11.5px/1.55 ui-monospace,Consolas,monospace;overflow:auto;margin:var(--s2) 0 0;white-space:pre-wrap;word-break:break-all}
.note{color:var(--muted);font-size:11.5px;margin:var(--s1) 0 0;line-height:1.5}
:where(a,button,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:var(--r1)}
.icon{width:18px;height:18px;display:inline-block;vertical-align:-.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-sm{width:15px;height:15px}

input,select,textarea{background:var(--input);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r1);padding:0 10px;height:var(--ctl-h);font:inherit;font-size:12.8px;max-width:100%}
input:focus,select:focus{outline:none;border-color:var(--focus);box-shadow:var(--focus-ring)}
input:disabled,select:disabled{background:var(--grey2);color:var(--muted);cursor:not-allowed}
input[type=checkbox],input[type=radio]{height:auto;width:auto;accent-color:var(--blue);vertical-align:middle;margin:0 5px 0 0}
input[type=file]{padding:6px 8px;height:auto}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{color:var(--ink2);font-size:11px;font-weight:600;letter-spacing:.02em}
.fld input,.fld select{width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s3) var(--s4)}
.req{color:var(--bad)}

button{font:inherit;font-size:12.5px;font-weight:600;height:var(--ctl-h);padding:0 var(--s4);background:var(--panel);color:var(--ink);border:1px solid var(--line-strong);border-radius:var(--r1);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover:not(:disabled){background:var(--soft);border-color:var(--steel)}
button:disabled{opacity:.55;cursor:not-allowed}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover:not(:disabled){background:var(--blue-hover);border-color:var(--blue-hover)}
html[data-theme="dark"] button.primary{color:#06121e}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
html[data-theme="dark"] button.danger{color:#1c0806}
button.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
button.ghost:hover:not(:disabled){background:var(--soft);border-color:var(--line);color:var(--ink)}
button.sm{height:var(--ctl-h-sm);padding:0 var(--s3);font-size:11.5px}
button.xs{height:24px;padding:0 6px;font-size:11px}
button.icon-btn{width:var(--ctl-h-sm);height:var(--ctl-h-sm);padding:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r2);overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;height:var(--ctl-h-sm);color:var(--ink2);font-size:12px}
.seg button.on{background:var(--blue);color:#fff}
html[data-theme="dark"] .seg button.on{color:#06121e}
.acts{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s4);flex-wrap:wrap}
.row{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh1);margin-bottom:var(--s4)}
.card-header{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.card-title{margin:0;font-size:13.5px;font-weight:650}
.card-body{padding:var(--s4)}
.banner{background:var(--blue2);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:var(--r1);padding:var(--s3) var(--s4);font-size:12.2px;line-height:1.55;margin-bottom:var(--s3)}
.banner.warn{background:var(--warn2);border-left-color:var(--warn)}
.banner.bad{background:var(--bad2);border-left-color:var(--bad)}
.banner.good{background:var(--good2);border-left-color:var(--good)}
.badge{font-size:10.5px;font-weight:650;letter-spacing:.02em;padding:2px 8px;border-radius:999px;border:1px solid transparent;display:inline-block;white-space:nowrap}
.b-good{background:var(--good2);color:var(--good);border-color:var(--good)}
.b-warn{background:var(--warn2);color:var(--warn);border-color:var(--warn)}
.b-bad{background:var(--bad2);color:var(--bad);border-color:var(--bad)}
.b-blue{background:var(--blue2);color:var(--blue);border-color:var(--blue)}
.b-grey{background:var(--neutral2);color:var(--ink2);border-color:var(--line-strong)}
.b-teal{background:var(--teal2);color:var(--teal);border-color:var(--teal)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2)}
table{border-collapse:collapse;width:100%;font-size:12.2px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:var(--soft);color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;padding:7px 10px}
tbody tr:last-child td{border-bottom:0}
td input,td select{height:30px;font-size:12px;width:100%;min-width:70px}
td.tight{width:1%;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--row-hover)}
tr.detail td{background:var(--soft);padding:var(--s3) var(--s4)}

/* ---- login -------------------------------------------------------------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(320px,42%) 1fr}
.login-brand{background:var(--sidebar-bg);color:var(--sidebar-ink);padding:var(--s6);display:flex;flex-direction:column;gap:var(--s5);
  background-image:linear-gradient(180deg,rgba(29,78,127,.35),rgba(15,36,56,0) 55%)}
.lb-top{display:flex;align-items:center;gap:10px}
.lb-top .icon{width:28px;height:28px}
.lb-top b{display:block;font-size:15px;color:#fff}
.lb-top span{font-size:11px;color:var(--sidebar-muted)}
.lb-mid{margin-top:auto}
.lb-mid h1{color:#fff;font-size:30px;line-height:1.15;font-weight:650;letter-spacing:-.02em;text-wrap:balance}
.lb-mid p{color:var(--sidebar-muted);font-size:13px;max-width:38ch;margin:var(--s3) 0 0}
.lb-demo{margin-top:auto;border:1px dashed #3a5b7a;border-radius:var(--r2);padding:var(--s3)}
.lb-demo h3{color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:var(--s2)}
.lb-demo p{color:var(--sidebar-muted);font-size:11.5px;margin:0 0 var(--s2)}
.acct{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;height:auto;padding:7px 10px;margin-top:4px;background:rgba(255,255,255,.05);border:1px solid #27445f;color:var(--sidebar-ink);text-align:left;justify-content:stretch;font-weight:500}
.acct:hover:not(:disabled){background:rgba(255,255,255,.11);border-color:#3f6a92}
.acct small{color:var(--sidebar-muted);font-size:11px}
.acct code{background:#0a1a2a;color:#cfe3f7}
.login-main{display:flex;flex-direction:column;padding:var(--s4) var(--s5) var(--s6);min-width:0}
.login-tools{display:flex;justify-content:flex-end;gap:var(--s2)}
.login-card{margin:auto;width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh2);padding:var(--s5)}
.login-card.wide{max-width:560px}
.login-card h2{font-size:20px;font-weight:650}
.login-card .fld{margin-top:var(--s4)}
.login-card .fld input{height:44px;font-size:14px}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-wrap button{position:absolute;right:4px;top:4px;height:36px;width:36px;padding:0;border:0;background:transparent;color:var(--muted)}
.login-card button.primary.big{width:100%;height:44px;font-size:14px;margin-top:var(--s4)}
.err-line{margin-top:var(--s3);color:var(--bad);font-size:12.2px;font-weight:600;display:flex;gap:6px;align-items:flex-start}

.vault-opt{display:flex;gap:var(--s3);align-items:center;width:100%;height:auto;padding:var(--s3);margin-top:var(--s2);text-align:left;justify-content:flex-start;white-space:normal;border-radius:var(--r2);font-weight:500}
.vault-opt.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset;background:var(--blue2)}
.vault-opt .vo-ic{width:36px;height:36px;border-radius:var(--r2);background:var(--grey2);display:grid;place-items:center;flex:none;color:var(--ink2)}
.vault-opt.on .vo-ic{background:var(--blue);color:#fff}
.vault-opt b{display:block;font-size:13.5px}
.vault-opt small{color:var(--muted);font-size:11.5px;display:block;word-break:break-word}
.vault-opt .vo-end{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.vault-opt.new{border-style:dashed;color:var(--blue)}

/* ---- shell -------------------------------------------------------------- */
.app-sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sidebar-w);background:var(--sidebar-bg);color:var(--sidebar-ink);display:flex;flex-direction:column;overflow-y:auto;z-index:60}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:var(--s4) var(--s3);border-bottom:1px solid var(--header-line)}
.sidebar-brand .icon{width:24px;height:24px}
.sidebar-brand b{display:block;font-size:14px}
.sidebar-brand span{font-size:10.5px;color:var(--sidebar-muted)}
.vault-switch{margin:var(--s2);padding:8px 10px;height:auto;display:grid;grid-template-columns:1fr auto;gap:0 8px;text-align:left;justify-content:stretch;align-items:center;background:rgba(255,255,255,.06);border:1px solid #27445f;color:var(--sidebar-ink);white-space:normal}
.vault-switch:hover:not(:disabled){background:rgba(255,255,255,.12);border-color:#3f6a92}
.vault-switch small{grid-column:1;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sidebar-muted);font-weight:700}
.vault-switch b{grid-column:1;font-size:12.5px;word-break:break-word}
.vault-switch .icon{grid-column:2;grid-row:1/3;color:var(--sidebar-muted)}
nav.tabs{display:flex;flex-direction:column;gap:2px;padding:var(--s2);flex:1}
nav.tabs button{justify-content:flex-start;gap:10px;width:100%;background:transparent;color:var(--sidebar-muted);padding:9px 12px;height:auto;font-size:13px;font-weight:400;border:none}
nav.tabs button:hover:not(.on){background:rgba(255,255,255,.06);color:var(--sidebar-ink)}
nav.tabs button.on{background:var(--sidebar-active);color:#fff;font-weight:600}
.sidebar-foot{padding:var(--s3);border-top:1px solid var(--header-line);color:var(--sidebar-muted);font-size:10.5px}
.page-wrapper{margin-left:var(--sidebar-w);min-width:0}
.topbar{position:sticky;top:0;z-index:55;height:var(--topbar-h);background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--s2);padding-inline:var(--s4)}
.topbar-title{font-size:14px;font-weight:600}
.cmdbar{display:flex;align-items:center;gap:var(--s2);margin-left:auto;position:relative}
.lang-toggle{height:var(--ctl-h-sm);padding:0 var(--s2);background:var(--soft);font-size:11.5px;color:var(--ink2)}
.lang-toggle .dim{opacity:.45;font-weight:400}
.userchip{height:var(--ctl-h-sm);padding:0 10px;gap:7px;background:var(--soft);font-size:12.5px}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r2);box-shadow:var(--sh3);padding:4px;min-width:210px;z-index:70;display:flex;flex-direction:column}
.menu button{justify-content:flex-start;border:0;height:34px;font-weight:500;background:transparent}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
.page-body{padding:var(--s3) var(--s4) 64px}
.page-header{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s3);padding-bottom:var(--s2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.page-header h1{font-size:19px;font-weight:650;line-height:1.25}
.page-header .sub{font-size:12px;color:var(--muted);margin-top:2px}
.page-header .actions{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap}
.new-tag{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:var(--teal2);color:var(--teal);border:1px solid var(--teal);border-radius:var(--r1);padding:1px 6px;margin-left:8px;vertical-align:middle}

.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;border:1px solid var(--line-strong);background:var(--soft);font-size:11.5px;font-weight:600;color:var(--ink2)}
button.chip{cursor:pointer}
button.chip.on{background:var(--blue2);border-color:var(--blue);color:var(--blue)}
button.chip.done{background:var(--good2);border-color:var(--good);color:var(--good)}
.tree{font:12px/1.7 ui-monospace,Consolas,monospace;background:var(--soft);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3);overflow-x:auto;white-space:nowrap}
.tree .lv{display:block}
.tree .icon{width:14px;height:14px;color:var(--muted);margin-right:4px}
.lvl-row{display:grid;grid-template-columns:54px 1fr auto;gap:var(--s2);align-items:center;margin-top:6px}
.lvl-row>span{font-size:11px;color:var(--muted);font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:var(--s4)}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:var(--s4);flex-wrap:wrap}
.subtabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;color:var(--muted);height:36px;font-weight:600}
.subtabs button.on{color:var(--blue);border-bottom-color:var(--blue)}

/* ---- timeline ----------------------------------------------------------- */
.tl{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.tl-row{display:grid;grid-template-columns:230px 1fr;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-name{padding:8px 10px;border-right:1px solid var(--line);font-size:12px;min-width:0}
.tl-name b{display:block}
.tl-name small{color:var(--muted)}
.tl-track{position:relative;min-height:44px;background:var(--panel)}
.tl-axis .tl-track{min-height:26px;background:var(--soft)}
.tl-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:10px;color:var(--muted);padding:5px 0 0 4px;white-space:nowrap}
.tl-bar{position:absolute;top:9px;height:26px;border-radius:var(--r1);font-size:10.5px;font-weight:650;padding:0 6px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;border:1px solid;min-width:4px}
.tl-bar.s-done{background:var(--good2);color:var(--good);border-color:var(--good)}
.tl-bar.s-doing{background:var(--blue2);color:var(--blue);border-color:var(--blue)}
.tl-bar.s-todo{background:var(--neutral2);color:var(--ink2);border-color:var(--line-strong)}
.tl-bar.s-late{background:var(--bad2);color:var(--bad);border-color:var(--bad);border-style:dashed}
.tl-today{position:absolute;top:0;bottom:0;border-left:2px solid #e11;z-index:2}

/* ---- modal + demo pill -------------------------------------------------- */
.modal-scrim{position:fixed;inset:0;background:rgba(10,20,32,.55);z-index:200;display:flex;padding:var(--s4);overflow:auto}
.modal{margin:auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r3);box-shadow:var(--sh3);width:100%;max-width:520px;padding:var(--s5)}
.modal h2{font-size:16px;margin-bottom:var(--s2)}
.modal .fld{margin-top:var(--s3)}
.bigpw{font:600 20px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em;background:var(--soft);border:1px dashed var(--line-strong);border-radius:var(--r2);padding:var(--s3);text-align:center;margin:var(--s3) 0;user-select:all}
.demo-pill{position:fixed;right:12px;bottom:12px;z-index:150;display:flex;gap:8px;align-items:center;background:#1c1c1c;color:#fff;border-radius:999px;padding:5px 6px 5px 12px;font-size:11px;font-weight:600;box-shadow:var(--sh3)}
.demo-pill button{height:24px;padding:0 10px;font-size:11px;border-radius:999px;background:#3a3a3a;border-color:#555;color:#fff}

@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login-brand{padding:var(--s4);gap:var(--s3)}
  .lb-mid{margin-top:0}.lb-mid h1{font-size:22px}
  .app-sidebar{position:static;width:auto}
  nav.tabs{flex-direction:row;flex-wrap:wrap}
  nav.tabs button{width:auto}
  .sidebar-foot{display:none}
  .page-wrapper{margin-left:0}
  .split{grid-template-columns:1fr}
  .tl-row{grid-template-columns:120px 1fr}
}
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

/* cfg = {name, fields, processes, doctypes, folder} */
function templateSheets(cfg) {

  return [
    { name: 'README', widths: [110], rows: [
      ['How to fill this vault template / Cách điền mẫu kho cá nhân'],
      ['Vault: ' + cfg.name],
      ['1. Fields — one row per piece of information you register for a project. Type is one of: Text, Number, Date, List, Yes/No. For List, put the choices in Options separated by ;'],
      ['2. Processes — one row per workflow you run in this vault.'],
      ['3. Steps — one row per step. Process name must match the Processes sheet. Duration (days) sets the deadline of each step counted from the project start. Required documents = DocTypes codes separated by ;'],
      ['4. DocTypes — the kinds of document you file. Code is short, no spaces.'],
      ['5. FolderStructure — one row per folder level, top level first. Use [Project ID], [Process], [Step], [DocType] or any [Field label]. Plain text is kept as typed.'],
      ['Keep the header row of every sheet. Do not rename the sheets. Then import the file in Vault setup > Excel template.'],
      ['Giữ nguyên dòng tiêu đề và tên các sheet. Sau khi điền, nhập lại tệp tại Thiết lập kho > Mẫu Excel.']

    { name: 'Fields', widths: [30, 14, 50, 12, 14], rows: [['Field label', 'Type', 'Options (for List; separate with ;)', 'Required', 'Show in list']]

    { name: '_rels/.rels', data: H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: 'xl/workbook.xml', data: H + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'

    { name: 'xl/_rels/workbook.xml.rels', data: H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')

    let p = processes.find(x => x.name.toLowerCase() === s.proc.toLowerCase());
    if (!p) { warn.push('Step "' + s.name + '": process "' + s.proc + '" is not on the Processes sheet, added it.'); p = { id: 'p_' + uid(), name: s.proc || 'Process', desc: '', steps: [] }; processes.push(p); }
    const bad = s.docs.filter(c => !codes.has(c));
    if (bad.length) warn.push('Step "' + s.name + '": document code ' + bad.join(', ') + ' is not on the DocTypes sheet, skipped.');
    p.steps.push({ name: s.name, days: s.days, docs: s.docs.filter(c => codes.has(c)) });
  });
  processes.filter(p => !p.steps.length).forEach(p => warn.push('Process "' + p.name + '" has no steps.'));
  const folder = rows('FolderStructure').map(r => cell(r, 1)).filter(Boolean);
  return { fields, doctypes, processes, folder, warn };
}

/* Real salted PBKDF2-HMAC-SHA256, the same scheme the server build will use
   (.NET Rfc2898DeriveBytes). Fallback only exists so the demo still opens in
   a browser that withholds WebCrypto from a local file. */
async function hashPw(pw, saltB64) {
  const salt = saltB64 ? b64d(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  if (window.crypto && crypto.subtle) {
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, key, 256);
    return 'pbkdf2-sha256$100000$' + b64(salt) + '$' + b64(new Uint8Array(bits));
  }
  let x = 2166136261; const s = b64(salt) + pw;
  for (let r = 0; r < 2000; r++) for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; }
  return 'demo-fallback$2000$' + b64(salt) + '$' + x.toString(16);
}
async function verifyPw(pw, stored) { return (await hashPw(pw, stored.split('$')[2])) === stored; }

const stepState = s => s.status === 'done' ? 'done' : (s.due < iso(today()) ? 'late' : s.status);

function resolvePath(v, p, stepName, code) {

function render() {

const val = id => { const e = document.getElementById(id); return e ? e.value : ''; };
function enterVault(id) { S.session.vault = id; UI.screen = 'app'; UI.view = null; UI.modal = null; UI.expanded = null; UI.draft = null; UI.menu = false; UI.setupTab = 'fields'; save(); render(); }
function moveIn(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
const getPath = (o, path) => path.split('.').reduce((a, k) => a[k], o);
function setPath(o, path, v) { const ks = path.split('.'); const last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; }
function newDraft(v) { const proc = v.processes[0], start = iso(today()); let acc = 0; return { values: {}, processId: proc.id, start, dues: proc.steps.map(s => { acc += s.days; return addDays(start, acc); }), err: '' }; }
function recalcDraft(v) { const d = UI.draft, proc = v.processes.find(p => p.id === d.processId); let acc = 0; d.dues = proc.steps.map(s => { acc += s.days; return addDays(d.start, acc); }); }

  lang() { S.lang = S.lang === 'en' ? 'vi' : 'en'; save(); render(); },

  pwMode(b) { S.pwMode = b.dataset.m; UI.reveal = {}; save(); render(); },
  toggleDisk() { UI.showDisk = !UI.showDisk; render(); },
  async resetPw(b) { const u = S.users.find(x => x.username === b.dataset.u), pw = tempPw(); u.hash = await hashPw(pw); u.recover = pw; u.mustChange = true; u.changed = iso(today()); save(); UI.modal = { type: 'temp', user: u.username, pw }; render(); },
  delUser(b) { S.users = S.users.filter(x => x.username !== b.dataset.u); save(); render(); },
  reveal(b) { const n = b.dataset.u; if (UI.reveal[n]) { delete UI.reveal[n]; render(); } else { UI.modal = { type: 'reauth', user: n }; render(); } },
  cLvl(b) { const i = +b.dataset.i, d = +b.dataset.d; if (d === 0) S.common.pattern.splice(i, 1); else moveIn(S.common.pattern, i, d); save(); render(); },
  cAdd(b) { S.common.pattern.push('[' + b.dataset.t + ']'); save(); render(); },
  openVault(b) { enterVault(b.dataset.id); },
  archive(b) { const v = S.vaults.find(x => x.id === b.dataset.id); v.archived = !v.archived; save(); render(); },
  regOpen() { const v = curVault(); if (!v.processes.length || !v.processes[0].steps.length) { UI.flash = L('Add a process with at least one step in Vault setup first.', 'Hãy thêm quy trình có ít nhất một bước ở Thiết lập kho trước.'); render(); return; } UI.draft = newDraft(v); render(); },
  regCancel() { UI.draft = null; render(); },
  expand(b) { UI.expanded = UI.expanded === b.dataset.id ? null : b.dataset.id; render(); },
  attach(b) { const v = curVault(), p = v.projects[+b.dataset.p], s = p.steps[+b.dataset.s], c = b.dataset.c; s.docs[c] = s.docs[c] ? '' : c + '_' + p.id + '.pdf'; save(); render(); },
  setupTab(b) { UI.setupTab = b.dataset.t; render(); },
  mv(b) { const arr = getPath(curVault(), b.dataset.arr); moveIn(arr, +b.dataset.i, +b.dataset.d); save(); render(); },
  rm(b) { const v = curVault(), arr = getPath(v, b.dataset.arr); arr.splice(+b.dataset.i, 1); if (b.dataset.arr === 'processes') UI.procSel = 0; save(); render(); },
  addField() { curVault().fields.push({ key: 'f_' + uid(), label: L('New field', 'Trường mới'), type: 'text', options: [], required: false, inList: false }); save(); render(); },
  procSel(b) { UI.procSel = +b.dataset.i; render(); },
  addProc() { const v = curVault(); v.processes.push({ id: 'p_' + uid(), name: L('New process', 'Quy trình mới'), desc: '', steps: [{ name: L('Step 1', 'Bước 1'), days: 7, docs: [] }] }); UI.procSel = v.processes.length - 1; save(); render(); },
  addStep() { const p = curVault().processes[UI.procSel]; p.steps.push({ name: L('Step ', 'Bước ') + (p.steps.length + 1), days: 7, docs: [] }); save(); render(); },
  togDoc(b) { const s = curVault().processes[UI.procSel].steps[+b.dataset.s], c = b.dataset.c, i = s.docs.indexOf(c); if (i < 0) s.docs.push(c); else s.docs.splice(i, 1); save(); render(); },
  addDoc() { const v = curVault(); v.doctypes.push({ code: 'DOC' + (v.doctypes.length + 1), name: '', hint: '' }); save(); render(); },
  addLevel() { const v = curVault(); v.folder.push('[DocType]'); UI.lastLevel = v.folder.length - 1; save(); render(); },
  tok(b) { const v = curVault(); if (!v.folder.length) v.folder.push(''); const i = UI.lastLevel != null && UI.lastLevel < v.folder.length ? UI.lastLevel : v.folder.length - 1; v.folder[i] = (v.folder[i] + ' [' + b.dataset.t + ']').trim(); save(); render(); },
  xlsxOut() { const v = curVault(), a = document.createElement('a'); a.href = URL.createObjectURL(buildWorkbook(v)); a.download = 'Vault_template_' + v.name.replace(/[^\w]+/g, '_') + '.xlsx'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); },
  applyImport() { const v = curVault(), c = UI.modal.cfg; applyConfig(v, c); UI.modal = null; UI.setupTab = 'fields'; UI.flash = L('Vault setup replaced from the Excel template.', 'Đã thay thiết lập kho từ mẫu Excel.'); save(); render(); }
};
/* Keep the values of already-registered projects for fields whose label did
   not change, and keep process ids by name so projects stay attached. */
function applyConfig(v, c) {
  c.fields.forEach(f => { const old = (v.fields || []).find(o => o.label.toLowerCase() === f.label.toLowerCase()); if (old) f.key = old.key; });
  c.processes.forEach(p => { const old = (v.processes || []).find(o => o.name.toLowerCase() === p.name.toLowerCase()); if (old) p.id = old.id; });
  v.fields = c.fields; v.processes = c.processes; v.doctypes = c.doctypes; v.folder = c.folder.length ? c.folder : ['[Project ID]'];
  UI.procSel = 0;
}
async function readTemplateFile(file) { return parseTemplate(readSheets(await unzip(await file.arrayBuffer()))); }

const SUBMIT = {
  async login() {
    const name = val('lgUser').trim(), pw = val('lgPw'); UI.loginUser = name;
    if (UI.lockUntil > Date.now()) return;
    const u = S.users.find(x => x.username.toLowerCase() === name.toLowerCase());
    if (!u || !(await verifyPw(pw, u.hash))) {
      UI.fails++;
      if (UI.fails >= 5) { UI.lockUntil = Date.now() + 30000; UI.fails = 0; UI.loginErr = L('Too many wrong tries. Locked for 5 minutes (30 seconds in this demo).', 'Sai quá nhiều lần. Khóa 5 phút (30 giây trong bản demo).'); setTimeout(() => { UI.loginErr = ''; if (UI.screen === 'login') render(); }, 30000); }
      else UI.loginErr = L('Wrong user name or password.', 'Sai tên đăng nhập hoặc mật khẩu.') + ' (' + UI.fails + '/5)';
      return render();
    }
    UI.fails = 0; UI.loginErr = ''; S.session = { user: u.username, vault: 'common' }; UI.pick = 'common';
    UI.screen = u.mustChange ? 'setpw' : 'choose'; save(); render();
  },
  async setpw() {
    const a = val('np1'), b = val('np2'), u = me();
    if (a.length < 8) { UI.loginErr = L('Use at least 8 characters.', 'Dùng ít nhất 8 ký tự.'); return render(); }
    if (a !== b) { UI.loginErr = L('The two passwords are different.', 'Hai mật khẩu không giống nhau.'); return render(); }
    u.hash = await hashPw(a); u.recover = a; u.mustChange = false; u.changed = iso(today()); UI.loginErr = ''; UI.screen = 'choose'; save(); render();
  },
  enter() { enterVault(UI.pick); },
  async changePw() {
    const u = me(), m = UI.modal, a = val('cp1');
    if (!(await verifyPw(val('cp0'), u.hash))) m.err = L('The current password is wrong.', 'Mật khẩu hiện tại không đúng.');
    else if (a.length < 8) m.err = L('Use at least 8 characters.', 'Dùng ít nhất 8 ký tự.');
    else if (a !== val('cp2')) m.err = L('The two passwords are different.', 'Hai mật khẩu không giống nhau.');
    else { u.hash = await hashPw(a); u.recover = a; u.changed = iso(today()); UI.modal = null; UI.flash = L('Password changed.', 'Đã đổi mật khẩu.'); save(); }
    render();
  },
  async reauth() {
    const m = UI.modal;
    if (await verifyPw(val('ra'), me().hash)) { UI.reveal[m.user] = true; UI.modal = null; } else m.err = L('Wrong admin password.', 'Sai mật khẩu admin.');
    render();
  },
  async addUser() {
    const name = val('nuName').trim(); if (!name) return;
    if (S.users.some(x => x.username.toLowerCase() === name.toLowerCase())) { UI.flash = L('That user name already exists.', 'Tên người dùng đã tồn tại.'); return render(); }
    const pw = tempPw();
    S.users.push({ username: name, role: val('nuRole'), department: val('nuDept').trim(), hash: await hashPw(pw), mustChange: true, changed: iso(today()), recover: pw });
    save(); UI.modal = { type: 'temp', user: name, pw }; render();
  },
  async createVault() {
    const m = UI.modal, u = me(), name = val('nvName').trim().replace(/[\\/:*?"<>|]/g, '-');
    m.name = name;
    if (!name) { m.err = L('Give the vault a name.', 'Hãy đặt tên cho kho.'); return render(); }
    if (S.vaults.some(v => v.name.toLowerCase() === name.toLowerCase() && (v.kind === 'common' || v.owner === u.username))) { m.err = L('You already have a vault with this name.', 'Bạn đã có kho trùng tên.'); return render(); }
    let cfg;
    if (m.tpl === 'excel') {
      const f = document.getElementById('nvFile').files[0];
      if (!f) { m.err = L('Choose the filled .xlsx file.', 'Hãy chọn tệp .xlsx đã điền.'); return render(); }
      try { cfg = await readTemplateFile(f); } catch (e) { m.err = e.message; return render(); }
      if (!cfg.fields.length || !cfg.processes.length) { m.err = L('The workbook needs at least one field and one process.', 'Tệp cần ít nhất một trường và một quy trình.'); return render(); }
    } else cfg = TEMPLATES[m.tpl]();
    const v = { id: 'v_' + uid(), kind: 'personal', owner: u.username, name, archived: false, seq: 0, projects: [] };
    applyConfig(v, cfg); S.vaults.push(v);
    UI.flash = L('Vault created. Check the setup, then register your first project.', 'Đã tạo kho. Kiểm tra thiết lập rồi đăng ký dự án đầu tiên.');
    enterVault(v.id); UI.view = 'setup'; UI.flash = L('Vault created. Check the setup, then register your first project.', 'Đã tạo kho. Kiểm tra thiết lập rồi đăng ký dự án đầu tiên.'); render();
  },
  regSave() {
    const v = curVault(), d = UI.draft, miss = v.fields.filter(f => f.required && !String(d.values[f.key] || '').trim());
    if (miss.length) { d.err = L('Fill in: ', 'Hãy điền: ') + miss.map(f => f.label).join(', '); return render(); }
    const proc = v.processes.find(p => p.id === d.processId), p = newProject(v, d.values, proc, d.start, d.dues);
    v.projects.push(p); UI.draft = null; UI.expanded = p.id; UI.flash = p.id + ' ' + L('registered.', 'đã được đăng ký.'); save(); render();
  }
};
const CHG = {
  draftProc(t) { UI.draft.processId = t.value; recalcDraft(curVault()); render(); },
  draftStart(t) { if (t.value) { UI.draft.start = t.value; recalcDraft(curVault()); render(); } },
  fOpts(t) { curVault().fields[+t.dataset.i].options = t.value.split(';').map(s => s.trim()).filter(Boolean); save(); },
  dCode(t) { const v = curVault(), d = v.doctypes[+t.dataset.i], nw = t.value.trim().toUpperCase().replace(/\s+/g, '-') || d.code, old = d.code;
    v.processes.forEach(p => p.steps.forEach(s => { s.docs = s.docs.map(c => c === old ? nw : c); })); d.code = nw; save(); render(); },
  nvName(t) { UI.modal.name = t.value; render(); const e = document.getElementById('nvName'); e.focus(); e.setSelectionRange(e.value.length, e.value.length); },
  nvTpl(t) { UI.modal.tpl = t.value; UI.modal.name = val('nvName'); render(); },
  async xlsxIn(t) { const f = t.files[0]; if (!f) return; try { UI.modal = { type: 'import', file: f.name, cfg: await readTemplateFile(f) }; } catch (e) { UI.flash = e.message; } render(); }
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a) { if (UI.menu) { UI.menu = false; render(); } return; }
  if (e.target.closest('input,select') && a.tagName === 'TR') return;
  ACT[a.dataset.act](a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (UI.modal || UI.menu)) { UI.modal = null; UI.menu = false; render(); }
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) ACT[e.target.dataset.act](e.target, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (f) { e.preventDefault(); SUBMIT[f.dataset.submit](f); } });
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.lvl != null) UI.lastLevel = +e.target.dataset.lvl; });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.path) {
    const root = t.dataset.root === 'common' ? S.common : t.dataset.root === 'state' ? S : t.dataset.root === 'draft' ? UI.draft : curVault();
    setPath(root, t.dataset.path, t.type === 'checkbox' ? t.checked : (t.dataset.num != null ? Math.max(0, Math.round(+t.value) || 0) : t.value));
    save(); if (t.dataset.rr != null) render();
    return;
  }
  if (t.dataset.chg) CHG[t.dataset.chg](t, e);
});

(async function boot() {
  try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { S = null; }
  if (!S || !S.users || !S.vaults) { S = await seed(); save(); }
  if (S.session && me() && curVault()) { UI.screen = me().mustChange ? 'setpw' : 'app'; } else S.session = null;
  render();
})();
</script>
</body>
